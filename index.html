<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Bella Massa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f5f5;padding:20px;}
h1{text-align:center;margin-bottom:20px;}

.hidden{display:none;}
.container{max-width:1000px;margin:auto;}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#e63946;
color:white;
margin-top:5px;
}

input,select,textarea{
width:100%;
padding:8px;
margin:6px 0;
border-radius:6px;
border:1px solid #ccc;
}

.pizza{border-bottom:1px solid #eee;padding:10px 0;}
.cart-item{border-bottom:1px solid #ddd;padding:8px 0;}
.total{font-weight:bold;margin-top:10px;}

.admin-pedido{
border:1px solid #ddd;
padding:10px;
border-radius:8px;
margin-bottom:10px;
background:#fafafa;
}

#loginBox button.google{
background:#4285f4;
}
</style>
</head>
<body>

<h1>🍕 Bella Massa</h1>

<!-- LOGIN / CADASTRO -->
<div id="loginBox" class="card">
<h2>Login / Cadastro</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="senha" placeholder="Senha">
<button onclick="loginEmail()">Entrar / Criar Conta</button>
<button class="google" onclick="loginGoogle()">Entrar com Google</button>
</div>

<!-- CLIENTE -->
<div id="clienteArea" class="hidden container">
<div class="card">
<h2>Cardápio</h2>

<div class="pizza">
<h3>Calabresa</h3>
<select id="size1">
<option value="30">Pequena - 30</option>
<option value="40">Média - 40</option>
<option value="50">Grande - 50</option>
</select>
<input type="number" id="qty1" value="1" min="1">
<button onclick="addToCart('Calabresa','size1','qty1')">Adicionar</button>
</div>

<div class="pizza">
<h3>Frango com Catupiry</h3>
<select id="size2">
<option value="32">Pequena - 32</option>
<option value="42">Média - 42</option>
<option value="52">Grande - 52</option>
</select>
<input type="number" id="qty2" value="1" min="1">
<button onclick="addToCart('Frango','size2','qty2')">Adicionar</button>
</div>

</div>

<div class="card">
<h2>🛒 Carrinho</h2>
<div id="cart"></div>
<div class="total">Total: R$ <span id="total">0</span></div>
<button onclick="abrirFinalizacao()">Finalizar Pedido</button>
<button onclick="logout()">Sair</button>
</div>
</div>

<!-- FINALIZAÇÃO PEDIDO -->
<div id="finalizacao" class="hidden card">
<h3>Finalizar Pedido</h3>
<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefone" placeholder="Telefone">
<input type="text" id="endereco" placeholder="Endereço">
<textarea id="obs" placeholder="Observação"></textarea>
<select id="pagamento">
<option value="">Forma de pagamento</option>
<option value="Pix">Pix</option>
<option value="Cartão">Cartão</option>
<option value="Dinheiro">Dinheiro</option>
</select>
<button onclick="confirmarPedido()">Confirmar Pedido</button>
</div>

<!-- ADMIN -->
<div id="adminArea" class="hidden container">
<div class="card">
<h2>Painel de Pedidos</h2>
<div id="listaPedidos"></div>
<button onclick="logout()">Sair</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBYZdGJ4w8ZpTcksVaZmEGuK0I6gt_b3jk",
  authDomain: "pizzariaapp-44dec.firebaseapp.com",
  projectId: "pizzariaapp-44dec",
  storageBucket: "pizzariaapp-44dec.firebasestorage.app",
  messagingSenderId: "684388458766",
  appId: "1:684388458766:web:0181eee4647e02a277f75f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// 🔥 Admin fixo
const admins = ["admin1@email.com","admin2@email.com"];

// 🛒 Carrinho
let cart = [];
let total = 0;

// LOGIN / CADASTRO EMAIL
async function loginEmail(){
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;
  try{
    const userCredential = await createUserWithEmailAndPassword(auth,email,senha);
    alert("Conta criada e logado!");
    verificarAdmin(userCredential.user.email);
  }catch(e){
    if(e.code === "auth/email-already-in-use" || e.code==="auth/wrong-password"){
      const userCredential = await signInWithEmailAndPassword(auth,email,senha);
      alert("Login realizado!");
      verificarAdmin(userCredential.user.email);
    }else{
      alert(e.message);
    }
  }
}

// LOGIN GOOGLE
async function loginGoogle(){
  try{
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    alert("Login Google realizado!");
    verificarAdmin(user.email);
  }catch(e){alert(e.message);}
}

// VERIFICAR ADMIN
function verificarAdmin(email){
  document.getElementById("loginBox").classList.add("hidden");
  if(admins.includes(email)){
    document.getElementById("adminArea").classList.remove("hidden");
    carregarPedidos();
  } else {
    document.getElementById("clienteArea").classList.remove("hidden");
  }
}

// LOGOUT
function logout(){ signOut(auth); location.reload(); }

// CARRINHO
function addToCart(nome,sizeId,qtyId){
  let price = parseFloat(document.getElementById(sizeId).value);
  let qty = parseInt(document.getElementById(qtyId).value);
  let subtotal = price * qty;
  cart.push({nome,qty,subtotal});
  updateCart();
}

function updateCart(){
  const cartDiv = document.getElementById("cart");
  cartDiv.innerHTML="";
  total=0;
  cart.forEach(item=>{
    total+=item.subtotal;
    cartDiv.innerHTML += `<div class="cart-item">${item.nome} - ${item.qty}x - R$ ${item.subtotal}</div>`;
  });
  document.getElementById("total").innerText = total;
}

// FINALIZAR PEDIDO
function abrirFinalizacao(){
  if(cart.length===0){alert("Carrinho vazio"); return;}
  document.getElementById("finalizacao").classList.remove("hidden");
}

async function confirmarPedido(){
  const pedido = {
    clienteEmail: auth.currentUser.email,
    nome: document.getElementById("nome").value,
    telefone: document.getElementById("telefone").value,
    endereco: document.getElementById("endereco").value,
    obs: document.getElementById("obs").value,
    pagamento: document.getElementById("pagamento").value,
    itens: cart,
    total: total,
    status: "Recebido",
    data: new Date()
  };
  await addDoc(collection(db,"pedidos"),pedido);
  alert("Pedido enviado!");
  cart=[]; updateCart();
  document.getElementById("finalizacao").classList.add("hidden");
}

// ADMIN
async function carregarPedidos(){
  const lista = document.getElementById("listaPedidos");
  lista.innerHTML = "";
  const q = query(collection(db,"pedidos"), orderBy("data","desc"));
  const querySnapshot = await getDocs(q);
  querySnapshot.forEach((docSnap)=>{
    const p = docSnap.data();
    const docId = docSnap.id;
    lista.innerHTML += `
    <div class="admin-pedido">
      <strong>${p.nome}</strong><br>
      Telefone: ${p.telefone}<br>
      Endereço: ${p.endereco}<br>
      Pagamento: ${p.pagamento}<br>
      Total: R$ ${p.total}<br>
      Status: <span id="status-${docId}">${p.status}</span><br>
      <button onclick="mudarStatus('${docId}','Em preparo')">Em preparo</button>
      <button onclick="mudarStatus('${docId}','Saiu para entrega')">Saiu para entrega</button>
      <button onclick="mudarStatus('${docId}','Entregue')">Entregue</button>
    </div>`;
  });
}

// MUDAR STATUS
async function mudarStatus(docId,status){
  await updateDoc(doc(db,"pedidos",docId),{status: status});
  document.getElementById("status-"+docId).innerText = status;
}

</script>
</body>
</html>
