<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Bella Massa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f5f5;padding:20px;}
h1{text-align:center;margin-bottom:20px;}

.container{max-width:400px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
input,select,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc;}
button{background:#e63946;color:white;border:none;cursor:pointer;}
button:hover{opacity:0.9;}
.link{color:#e63946;cursor:pointer;text-align:center;margin-top:10px;}

.hidden{display:none;}
.admin-area, .cliente-area{margin-top:20px;}
</style>
</head>
<body>

<h1>🍕 Bella Massa</h1>

<!-- LOGIN -->
<div class="container" id="loginBox">
<h2>Login</h2>
<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginSenha" placeholder="Senha">
<button onclick="login()">Entrar</button>
<div class="link" onclick="mostrarCadastro()">Criar conta</div>
</div>

<!-- CADASTRO -->
<div class="container hidden" id="cadastroBox">
<h2>Criar Conta</h2>
<input type="text" id="cadNome" placeholder="Nome">
<input type="email" id="cadEmail" placeholder="Email">
<input type="password" id="cadSenha" placeholder="Senha">
<button onclick="cadastrar()">Cadastrar</button>
<div class="link" onclick="mostrarLogin()">Voltar ao login</div>
</div>

<!-- AREA CLIENTE -->
<div class="container hidden cliente-area" id="clienteArea">
<h2>Área do Cliente</h2>
<p id="clienteNome"></p>
<button onclick="logout()">Sair</button>
</div>

<!-- AREA ADMIN -->
<div class="container hidden admin-area" id="adminArea">
<h2>Painel Admin</h2>
<p id="adminNome"></p>
<button onclick="logout()">Sair</button>
</div>

<script>

// ADMINS FIXOS
const admins = [
  {email:"admin@pizza.com", senha:"123456", tipo:"admin_principal", nome:"Admin Principal"},
  {email:"dono@pizza.com", senha:"123456", tipo:"dono", nome:"Dono"},
  {email:"gerente@pizza.com", senha:"123456", tipo:"admin", nome:"Gerente"}
];

// pegar usuários do localStorage
let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

function mostrarCadastro(){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("cadastroBox").classList.remove("hidden");
}

function mostrarLogin(){
document.getElementById("cadastroBox").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
}

function cadastrar(){
let nome = cadNome.value;
let email = cadEmail.value;
let senha = cadSenha.value;

if(!nome || !email || !senha){
alert("Preencha tudo!");
return;
}

usuarios.push({nome,email,senha,tipo:"cliente"});
localStorage.setItem("usuarios",JSON.stringify(usuarios));

alert("Conta criada!");
mostrarLogin();
}

function login(){
let email = loginEmail.value;
let senha = loginSenha.value;

// verificar admin
let admin = admins.find(a => a.email===email && a.senha===senha);
if(admin){
abrirAdmin(admin);
return;
}

// verificar cliente
let user = usuarios.find(u => u.email===email && u.senha===senha);
if(user){
abrirCliente(user);
return;
}

alert("Login inválido!");
}

function abrirCliente(user){
loginBox.classList.add("hidden");
clienteArea.classList.remove("hidden");
clienteNome.innerText = "Bem-vindo, " + user.nome;
}

function abrirAdmin(admin){
loginBox.classList.add("hidden");
adminArea.classList.remove("hidden");
adminNome.innerText = "Logado como: " + admin.nome + " ("+admin.tipo+")";
}

function logout(){
location.reload();
}

</script>

</body>
</html>
