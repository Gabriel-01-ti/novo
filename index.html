<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Bella Massa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f5f5;padding:20px;}
h1{text-align:center;margin-bottom:20px;}

.hidden{display:none;}

.container{max-width:1000px;margin:auto;}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#e63946;
color:white;
margin-top:5px;
}

input,select,textarea{
width:100%;
padding:8px;
margin:6px 0;
border-radius:6px;
border:1px solid #ccc;
}

.pizza{border-bottom:1px solid #eee;padding:10px 0;}
.cart-item{border-bottom:1px solid #ddd;padding:8px 0;}
.total{font-weight:bold;margin-top:10px;}

.admin-pedido{
border:1px solid #ddd;
padding:10px;
border-radius:8px;
margin-bottom:10px;
background:#fafafa;
}
</style>
</head>
<body>

<h1>🍕 Bella Massa</h1>

<!-- LOGIN -->
<div id="loginArea" class="card">
<h2>Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="senha" placeholder="Senha">
<button onclick="login()">Entrar</button>
</div>

<!-- CLIENTE AREA -->
<div id="clienteArea" class="hidden container">

<div class="card">
<h2>Cardápio</h2>

<div class="pizza">
<h3>Calabresa</h3>
<select id="size1">
<option value="30">Pequena - 30</option>
<option value="40">Média - 40</option>
<option value="50">Grande - 50</option>
</select>
<input type="number" id="qty1" value="1" min="1">
<button onclick="addToCart('Calabresa','size1','qty1')">Adicionar</button>
</div>

<div class="pizza">
<h3>Frango com Catupiry</h3>
<select id="size2">
<option value="32">Pequena - 32</option>
<option value="42">Média - 42</option>
<option value="52">Grande - 52</option>
</select>
<input type="number" id="qty2" value="1" min="1">
<button onclick="addToCart('Frango','size2','qty2')">Adicionar</button>
</div>

</div>

<div class="card">
<h2>🛒 Carrinho</h2>
<div id="cart"></div>
<div class="total">Total: R$ <span id="total">0</span></div>
<button onclick="abrirFinalizacao()">Finalizar Pedido</button>
<button onclick="logout()">Sair</button>
</div>

</div>

<!-- FINALIZAÇÃO -->
<div id="finalizacao" class="hidden card">
<h3>Finalizar Pedido</h3>
<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefone" placeholder="Telefone">
<input type="text" id="endereco" placeholder="Endereço">
<textarea id="obs" placeholder="Observação"></textarea>

<select id="pagamento" onchange="verificarPix()">
<option value="">Forma de pagamento</option>
<option value="Pix">Pix</option>
<option value="Cartão">Cartão</option>
<option value="Dinheiro">Dinheiro</option>
</select>

<div id="pixArea" class="hidden">
<p>Chave Pix: pizzaria@pix.com</p>
<input type="file" id="comprovante">
</div>

<button onclick="confirmarPedido()">Confirmar Pedido</button>
</div>

<!-- ADMIN AREA -->
<div id="adminArea" class="hidden container">
<div class="card">
<h2>Painel de Pedidos</h2>
<div id="listaPedidos"></div>
<button onclick="logout()">Sair</button>
</div>
</div>

<script>

// ADMINS FIXOS
const admins=[
{email:"gabriel.96052@aluno.iffar.edu.br",senha:"123456"},
{email:"dono@pizza.com",senha:"123456"}
];

let cart=[];
let total=0;

let pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];

// LOGIN
function login(){
let e=email.value;
let s=senha.value;

let isAdmin = admins.find(a=>a.email===e && a.senha===s);

if(isAdmin){
loginArea.classList.add("hidden");
adminArea.classList.remove("hidden");
carregarPedidos();
return;
}

loginArea.classList.add("hidden");
clienteArea.classList.remove("hidden");
}

// LOGOUT
function logout(){location.reload();}

// CARRINHO
function addToCart(nome,sizeId,qtyId){
let price=parseFloat(document.getElementById(sizeId).value);
let qty=parseInt(document.getElementById(qtyId).value);
let subtotal=price*qty;

cart.push({nome,qty,subtotal});
updateCart();
}

function updateCart(){
cartDiv.innerHTML="";
total=0;

cart.forEach(item=>{
total+=item.subtotal;
cartDiv.innerHTML+=`
<div class="cart-item">
${item.nome} - ${item.qty}x - R$ ${item.subtotal}
</div>`;
});

document.getElementById("total").innerText=total;
}

// FINALIZAÇÃO
function abrirFinalizacao(){
if(cart.length===0){alert("Carrinho vazio");return;}
finalizacao.classList.remove("hidden");
}

function verificarPix(){
if(pagamento.value==="Pix"){
pixArea.classList.remove("hidden");
}else{
pixArea.classList.add("hidden");
}
}

function confirmarPedido(){

let pedido={
nome:nome.value,
telefone:telefone.value,
endereco:endereco.value,
obs:obs.value,
pagamento:pagamento.value,
itens:cart,
total:total,
data:new Date().toLocaleString()
};

pedidos.push(pedido);
localStorage.setItem("pedidos",JSON.stringify(pedidos));

alert("Pedido enviado!");

cart=[];
updateCart();
finalizacao.classList.add("hidden");
}

// ADMIN
function carregarPedidos(){
listaPedidos.innerHTML="";

pedidos.forEach(p=>{
listaPedidos.innerHTML+=`
<div class="admin-pedido">
<strong>${p.nome}</strong><br>
Telefone: ${p.telefone}<br>
Endereço: ${p.endereco}<br>
Pagamento: ${p.pagamento}<br>
Total: R$ ${p.total}<br>
Data: ${p.data}
</div>
`;
});
}

</script>

</body>
</html>
