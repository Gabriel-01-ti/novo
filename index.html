<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Massa - Sistema de Pedidos</title>
    <style>
        :root { --primary: #e63946; --dark: #121212; --card: #1e1e1e; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: var(--dark); color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .hidden { display: none !important; }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        
        /* Formulários */
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #2c2c2c; color: #fff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: var(--primary); color: white; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        .btn-google { background: #4285f4; margin-top: 10px; }
        .btn-sec { background: #444; }

        /* Estilo Pedidos */
        .pedido-card { border-left: 5px solid var(--primary); background: #252525; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: var(--primary); margin-bottom: 10px; }
        .item-list { font-size: 14px; color: #bbb; margin: 10px 0; }
        .admin-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .admin-actions button { font-size: 12px; padding: 8px; margin: 0; }
        
        .pix-box { background: #1a3a3a; border: 1px solid #2a9d8f; padding: 15px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍕 Bella Massa</h1>

    <div id="loginBox" class="card">
        <h2 id="authTitle">Acessar Conta</h2>
        <div id="authFields">
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button onclick="handleAuth()">Entrar / Cadastrar</button>
            <button class="btn-google" onclick="loginGoogle()">Entrar com Google</button>
        </div>
    </div>

    <div id="clienteArea" class="hidden">
        <div class="card">
            <h2>Cardápio</h2>
            <div class="card" style="background: #252525;">
                <h3>Pizza Calabresa</h3>
                <select id="size1">
                    <option value="40">Média - R$ 40,00</option>
                    <option value="55">Grande - R$ 55,00</option>
                </select>
                <button onclick="addToCart('Calabresa', 'size1')">Adicionar ao Carrinho</button>
            </div>
            
            <div id="cartSection" class="hidden">
                <h3>🛒 Seu Carrinho</h3>
                <div id="cartItems"></div>
                <div style="font-size: 20px; margin: 15px 0;">Total: <strong>R$ <span id="cartTotal">0</span></strong></div>
                <button onclick="showFinalizar()">Finalizar Pedido</button>
            </div>
        </div>

        <div class="card">
            <h2>Meus Pedidos</h2>
            <div id="meusPedidos"></div>
        </div>
        <button class="btn-sec" onclick="logout()">Sair</button>
    </div>

    <div id="finalizarModal" class="hidden card">
        <h2>Dados de Entrega</h2>
        <input type="text" id="nomeCli" placeholder="Seu Nome">
        <input type="text" id="telCli" placeholder="WhatsApp">
        <input type="text" id="endCli" placeholder="Endereço Completo">
        <select id="metodoPagto" onchange="togglePixInfo()">
            <option value="Dinheiro">Dinheiro (na entrega)</option>
            <option value="Cartão">Cartão (na entrega)</option>
            <option value="Pix">Pix (enviar comprovante)</option>
        </select>

        <div id="pixInfo" class="hidden pix-box">
            <p>Chave Pix: <strong>12345678900</strong></p>
            <small>Anexe o comprovante abaixo:</small>
            <input type="file" id="comprovanteFile" accept="image/*">
        </div>

        <button onclick="enviarPedido()">Confirmar Pedido Agora</button>
        <button class="btn-sec" onclick="this.parentElement.classList.add('hidden')">Cancelar</button>
    </div>

    <div id="adminArea" class="hidden">
        <div class="card">
            <h2>Painel Administrativo</h2>
            <p>Pedidos recebidos hoje:</p>
            <div id="adminPedidos"></div>
        </div>
        <button class="btn-sec" onclick="logout()">Sair</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, query, orderBy, where, Timestamp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBYZdGJ4w8ZpTcksVaZmEGuK0I6gt_b3jk",
        authDomain: "pizzariaapp-44dec.firebaseapp.com",
        projectId: "pizzariaapp-44dec",
        storageBucket: "pizzariaapp-44dec.firebasestorage.app",
        messagingSenderId: "684388458766",
        appId: "1:684388458766:web:0181eee4647e02a277f75f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const ADMINS = ["gabriel.96052@aluno.iffar.edu.br"];
    let cart = [];

    // --- AUTENTICAÇÃO ---
    window.handleAuth = async () => {
        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;
        try {
            await signInWithEmailAndPassword(auth, email, senha);
        } catch (e) {
            try {
                await createUserWithEmailAndPassword(auth, email, senha);
                alert("Conta criada!");
            } catch (err) { alert(err.message); }
        }
    };

    window.loginGoogle = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("loginBox").classList.add("hidden");
            if (ADMINS.includes(user.email)) {
                document.getElementById("adminArea").classList.remove("hidden");
                loadAdminPedidos();
            } else {
                document.getElementById("clienteArea").classList.remove("hidden");
                loadMeusPedidos(user.email);
            }
        }
    });

    // --- LÓGICA DO CARRINHO ---
    window.addToCart = (nome, sizeId) => {
        const preco = parseFloat(document.getElementById(sizeId).value);
        cart.push({ nome, preco });
        updateCartUI();
    };

    function updateCartUI() {
        const list = document.getElementById("cartItems");
        const totalDisp = document.getElementById("cartTotal");
        list.innerHTML = "";
        let total = 0;
        cart.forEach(i => {
            total += i.preco;
            list.innerHTML += `<div>${i.nome} - R$ ${i.preco.toFixed(2)}</div>`;
        });
        document.getElementById("cartSection").classList.remove("hidden");
        totalDisp.innerText = total.toFixed(2);
    }

    // --- FIRESTORE: ENVIO DE PEDIDO ---
    window.showFinalizar = () => document.getElementById("finalizarModal").classList.remove("hidden");
    window.togglePixInfo = () => {
        const isPix = document.getElementById("metodoPagto").value === "Pix";
        document.getElementById("pixInfo").classList.toggle("hidden", !isPix);
    };

    window.enviarPedido = async () => {
        const pagto = document.getElementById("metodoPagto").value;
        if (pagto === "Pix" && !document.getElementById("comprovanteFile").files[0]) {
            return alert("Por favor, anexe o comprovante Pix.");
        }

        const pedido = {
            userId: auth.currentUser.uid,
            userEmail: auth.currentUser.email,
            cliente: document.getElementById("nomeCli").value,
            whatsapp: document.getElementById("telCli").value,
            endereco: document.getElementById("endCli").value,
            itens: cart,
            total: cart.reduce((acc, curr) => acc + curr.preco, 0),
            metodoPagto: pagto,
            status: pagto === "Pix" ? "Aguardando Confirmação Pix" : "Pendente",
            data: Timestamp.now()
        };

        try {
            await addDoc(collection(db, "pedidos"), pedido);
            alert("Pedido enviado com sucesso!");
            cart = [];
            document.getElementById("cartSection").classList.add("hidden");
            document.getElementById("finalizarModal").classList.add("hidden");
        } catch (e) { alert("Erro ao salvar: " + e.message); }
    };

    // --- FIRESTORE: LEITURA EM TEMPO REAL (ADMIN) ---
    function loadAdminPedidos() {
        const q = query(collection(db, "pedidos"), orderBy("data", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById("adminPedidos");
            container.innerHTML = "";
            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                const id = docSnap.id;
                container.innerHTML += `
                    <div class="pedido-card">
                        <span class="status-badge">${p.status}</span>
                        <p><strong>Cliente:</strong> ${p.cliente} (${p.whatsapp})</p>
                        <p><strong>Endereço:</strong> ${p.endereco}</p>
                        <div class="item-list">${p.itens.map(i => i.nome).join(", ")}</div>
                        <p>Total: R$ ${p.total.toFixed(2)} | <strong>${p.metodoPagto}</strong></p>
                        <div class="admin-actions">
                            <button onclick="updateStatus('${id}', 'Em preparo')">♨️ Preparar</button>
                            <button onclick="updateStatus('${id}', 'Saiu para entrega')">🚚 Enviar</button>
                            <button onclick="updateStatus('${id}', 'Entregue')">✅ Finalizar</button>
                            ${p.metodoPagto === 'Pix' ? `<button style="background:#2a9d8f" onclick="updateStatus('${id}', 'Pago - Em Preparo')">💰 Confirmar Pix</button>` : ''}
                        </div>
                    </div>
                `;
            });
        });
    }

    // --- FIRESTORE: LEITURA CLIENTE ---
    function loadMeusPedidos(email) {
        const q = query(collection(db, "pedidos"), where("userEmail", "==", email), orderBy("data", "desc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById("meusPedidos");
            container.innerHTML = "";
            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                container.innerHTML += `
                    <div class="pedido-card" style="border-left-color: #555">
                        <span class="status-badge">${p.status}</span>
                        <p>Total: R$ ${p.total.toFixed(2)}</p>
                        <small>Data: ${p.data.toDate().toLocaleString()}</small>
                    </div>
                `;
            });
        });
    }

    window.updateStatus = async (id, novoStatus) => {
        await updateDoc(doc(db, "pedidos", id), { status: novoStatus });
    };

</script>
</body>
</html>
